about:
  eyebrow:
    ru: Обо мне
    en: About
  heading:
    ru: Капитан портовых и линейных буксиров, опыт перевалки грузов на рейде и в прибрежном плавании
    en: Master of harbour and line tugs, experienced in roadstead cargo transshipment and coastal navigation
  paragraphs:
  - ru: 'На флоте с 2010 года, капитаном — с 2016-го. Работал сменным капитаном, старшим помощником капитана и капитаном буксиров-толкачей, линейного буксира и танкеров. С 08.2026 — капитан буксира-толкача ASD «ANATOLII HANKEVYCH» в компании «НИБУЛОН».'
    en: 'At sea since 2010 and a captain since 2016. I have served as relief captain, chief mate, and captain of pusher tugs, a line tug and tankers. Since 08.2026, captain of the ASD pusher tug ANATOLII HANKEVYCH at Nibulon.'
  - ru: Работал на внутренних водных путях Украины — Днепре и Южном Буге, в северо-западной части Чёрного моря и на Дунае. Образование — бакалавр по судовождению и инженер-электромеханик.
    en: 'I have worked on Ukraine''s inland waterways (the Dnipro and Southern Bug), in the north-western Black Sea and on the Danube. Education: Bachelor in Navigation and electromechanical engineer.'
