about:
  eyebrow:
    ru: Обо мне
    en: About
  heading:
    ru: Капитан с опытом на реках и в море
    en: A captain with river and sea experience
  paragraphs:
  - ru: 'С 2015 года работаю на флоте: сменным капитаном, старшим помощником капитана и капитаном буксиров-толкачей, линейного буксира, танкеров и теплоходов. С 08.2026 — капитан теплохода «ANATOLII HANKEVYCH» в компании «НИБУЛОН».'
    en: 'I have worked in the fleet since 2015: as relief captain, chief mate, and captain of pusher tugs, a line tug, tankers and motor vessels. Since 08.2026, captain of the motor vessel ANATOLII HANKEVYCH at Nibulon.'
  - ru: Работал на внутренних водных путях Украины — Днепре и Южном Буге, в северо-западной части Чёрного моря (порты Очаков, Николаев, Херсон, Одесса, Черноморск, Южный) и на Дунае (Измаил). Образование — бакалавр по судовождению и инженер-электромеханик.
    en: 'I have worked on Ukraine''s inland waterways (the Dnipro and Southern Bug), in the north-western Black Sea (ports of Ochakiv, Mykolaiv, Kherson, Odesa, Chornomorsk, Pivdennyi) and on the Danube (Izmail). Education: Bachelor in Navigation and electromechanical engineer.'
